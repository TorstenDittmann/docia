name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read
    pull-requests: write

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run oxlint
              run: bun run lint

    format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting
              run: bun run fmt:check

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run tests
              run: bun test

    build-binaries:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build binaries
              run: bun run scripts/build-binaries.ts

    example-previews:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build and deploy examples
              env:
                  NO_COLOR: "1"
              run: |
                  preview_file="$RUNNER_TEMP/example-previews.md"
                  : > "$preview_file"

                  while IFS= read -r config; do
                      example_dir="${config%/docia.config.ts}"
                      example_name="${example_dir#examples/}"

                      bun run src/cli.ts check --config "$config"
                      bun run src/cli.ts build --config "$config"

                      deploy_output="$(bunx @dittmann/yeet@1.0.4 "$example_dir/dist")"
                      printf '%s\n' "$deploy_output"
                      preview_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^[:space:]]+\.yeet\.page' | tail -n 1)"

                      if [ -z "$preview_url" ]; then
                          echo "Could not find the yeet.page URL for $example_name" >&2
                          exit 1
                      fi

                      printf '| `%s` | [Open preview](%s) |\n' "$example_name" "$preview_url" >> "$preview_file"
                  done < <(find examples -name docia.config.ts -type f | sort)

                  if [ ! -s "$preview_file" ]; then
                      echo "No example configurations found" >&2
                      exit 1
                  fi

                  echo "PREVIEW_FILE=$preview_file" >> "$GITHUB_ENV"

            - name: Comment preview links
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require("fs");
                      const marker = "<!-- docia-example-previews -->";
                      const rows = fs.readFileSync(process.env.PREVIEW_FILE, "utf8").trim();
                      const body = [
                        marker,
                        "## Example previews",
                        "",
                        `Built and deployed from \`${context.sha.slice(0, 7)}\`.`,
                        "",
                        "| Example | Preview |",
                        "| --- | --- |",
                        rows,
                      ].join("\n");

                      const comments = await github.paginate(github.rest.issues.listComments, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        per_page: 100,
                      });
                      const existing = comments.find(
                        (comment) => comment.user.type === "Bot" && comment.body?.includes(marker),
                      );

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                        });
                      }
